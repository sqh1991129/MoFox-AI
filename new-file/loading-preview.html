<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>MoFox AI - Loading 预览</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; background:#FAFAFC; font-family:-apple-system,"PingFang SC",sans-serif; }
  .card { background:#fff; border-radius:20px; padding:48px 64px; box-shadow:0 8px 30px rgba(79,70,229,.08); display:flex; flex-direction:column; align-items:center; gap:20px; }
  img.loader { width:160px; height:160px; }
  .text { color:#8B5CF6; font-size:15px; letter-spacing:2px; }
  .dots::after { content:""; animation: dots 1.5s steps(4,end) infinite; }
  @keyframes dots { 0%{content:"";} 25%{content:".";} 50%{content:"..";} 75%{content:"...";} }
  .small { display:flex; gap:32px; margin-top:8px; }
  .small img { width:48px; height:48px; }
  .small figure { margin:0; text-align:center; color:#999; font-size:12px; display:flex; flex-direction:column; gap:8px; align-items:center; }
</style>
</head>
<body>
  <div class="card">
    <img class="loader" src="mofox-loading.svg" alt="加载中" />
    <div class="text">墨狐正在创作中<span class="dots"></span></div>
  </div>
  <div class="small">
    <figure><img src="mofox-loading.svg" alt="中尺寸"/><figcaption>96px（弹窗内）</figcaption></figure>
    <figure><img src="mofox-loading.svg" alt="小尺寸"/><figcaption>48px（按钮内）</figcaption></figure>
  </div>
</body>
</html>
